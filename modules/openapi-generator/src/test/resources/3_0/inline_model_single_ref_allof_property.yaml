openapi: 3.0.0
info:
  title: single-$ref allOf property
  version: 1.0.0
paths: {}
components:
  schemas:
    ResourceReference:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
    ServerProperties:
      type: object
      properties:
        name:
          type: string
        bootVolume:
          description: >-
            Reference to a volume. A bare $ref cannot carry a description, so
            this is wrapped in a single-element allOf.
          allOf:
            - $ref: '#/components/schemas/ResourceReference'
